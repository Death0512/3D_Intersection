name: render-probe-1h-profile

on:
  push:
    branches:
      - agent/render-bootstrap-20260922

permissions:
  contents: read

jobs:
  render-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg sumo sumo-tools python3-pip python3-venv curl xz-utils

      - name: Install Python dependencies
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user Pillow traci sumolib ijson

      - name: Install Blender 5.2.0
        run: |
          curl -L --fail --retry 3             -o /tmp/blender-5.2.0-linux-x64.tar.xz             https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
          mkdir -p "$HOME/opt"
          tar -xJf /tmp/blender-5.2.0-linux-x64.tar.xz -C "$HOME/opt"
          echo "$HOME/opt/blender-5.2.0-linux-x64" >> "$GITHUB_PATH"
          "$HOME/opt/blender-5.2.0-linux-x64/blender" --version

      - name: Preflight
        run: |
          echo "=== GPU ==="
          (nvidia-smi || true)
          echo "=== SUMO ==="
          command -v sumo
          command -v netconvert
          sumo --version
          echo "=== FFmpeg ==="
          ffmpeg -version | head -3

      - name: Build exact 1-hour demand scenario
        run: |
          mkdir -p output/all_cameras_1h
          python3 scripts/run_pipeline.py             --seconds 3600             --fps 30             --demand-profile "file:$GITHUB_WORKSPACE/demand_profile_1h.json"             --out "$GITHUB_WORKSPACE/output/all_cameras_1h"             --phase cpu1             --skip-asset-check

      - name: Build first 60-frame Blender chunk from exact 1-hour scenario
        run: |
          mkdir -p output/probe
          blender -b --python scripts/build_unified_scene.py --             --scenario "$GITHUB_WORKSPACE/output/all_cameras_1h/scenario_blender.json"             --out "$GITHUB_WORKSPACE/output/probe/chunk_0000.blend"             --only in_N             --chunk-start 0             --chunk-end 59

      - name: Render 60 real Cycles frames at samples=24
        run: |
          cat > /tmp/render_cpu_probe.py <<'PY'
          import bpy, os, time

          scene_path = os.environ["SCENE"]
          out_dir = os.environ["OUT"]
          os.makedirs(out_dir, exist_ok=True)

          bpy.ops.wm.open_mainfile(filepath=scene_path)
          scene = bpy.context.scene
          scene.camera = bpy.data.objects["Camera_in_N"]
          scene.render.engine = "CYCLES"
          scene.cycles.device = "CPU"
          scene.cycles.samples = 24
          scene.render.resolution_x = 1920
          scene.render.resolution_y = 1080
          scene.render.resolution_percentage = 100
          scene.render.image_settings.file_format = "JPEG"
          scene.render.image_settings.quality = 95

          timings = []
          for frame in range(0, 60):
              t0 = time.time()
              scene.frame_set(frame)
              scene.render.filepath = os.path.join(out_dir, f"frame_{frame:06d}.jpg")
              bpy.ops.render.render(write_still=True)
              dt = time.time() - t0
              timings.append(dt)
              print(f"FRAME {frame:06d} {dt:.3f}s", flush=True)

          print(f"TOTAL_SECONDS {sum(timings):.3f}", flush=True)
          print(f"AVG_SECONDS_PER_FRAME {sum(timings)/len(timings):.3f}", flush=True)
          PY

          SCENE="$GITHUB_WORKSPACE/output/probe/chunk_0000.blend"           OUT="$GITHUB_WORKSPACE/output/probe/frames"           blender -b --python /tmp/render_cpu_probe.py

      - name: Upload rendered frames
        uses: actions/upload-artifact@v4
        with:
          name: render-probe-in_N-s24-60frames
          path: output/probe/frames/*.jpg
          retention-days: 1

      - name: Render timing summary
        if: always()
        run: |
          echo "=== probe output ==="
          ls -lh output/probe/frames 2>/dev/null || true
